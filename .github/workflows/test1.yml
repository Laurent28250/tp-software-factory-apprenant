name: test1

on:
  push: 
    branches: [ main, master ]
  pull_request:
    types: [opened, reopened]
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Secret Scanning
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --results=verified,unknown

  build:
    needs: test
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      # contents permission to clone the repository
      contents: read
      packages: read
      # issues and pull-requests permissions to write results as pull
      # request comments. Omit them if you don't need summary comments
      issues: write
      pull-requests: write
      # To report GitHub Actions status checks. Omit if you don't need
      # to update commit status
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@v8.6.0 # x-release-please-version
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Job_Build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Make mvnw executable
        run: chmod +x ./mvnw
      - name: Job maven_Build
        run: ./mvnw compile
      - name: Classes report
        uses: actions/upload-artifact@v7
        with:
          name: Upload Classes
          path: ./target/classes/*

  Job_Verify:
    needs: Job_Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Make mvnw executable
        run: chmod +x ./mvnw
      - name: Job Maven_Verify
        run: ./mvnw verify
      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: Jacoco
          path: ./target/site/jacoco/jacoco.xml
          archive: false 
  
  sonarqube:
    needs: Job_Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0
      - name: Download Classes
        uses: actions/download-artifact@v8
        with:
          name: Upload Classes
          path: ./Classes
      - name: Download Classes
        uses: actions/download-artifact@v8
        with:
          name: jacoco.xml
          path: ./
      - name: List dossier
        run: ls -lah
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=laurent28250
            -Dsonar.projectKey=Software-Factory
            -Dsonar.coverage.jacoco.xmlReportPaths=./jacoco.xml
            -Dsonar.java.binaries=./Classes

  docker:
    needs: sonarqube
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Login to tp-software-factory-apprenant
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Make mvnw executable
        run: chmod +x ./mvnw
      - name: Job Maven_Verify
        run: ./mvnw verify -B
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/laurent28250/tp-software-factory-apprenant:latest
          labels: ${{ steps.meta.outputs.labels }}