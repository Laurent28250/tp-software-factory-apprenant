name: test1

on:
  push: 
    branches: [ main ]
  
jobs:
  Job_Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Job maven_Build
        run: ./mvnw compile

  Job_Test:
    needs: Job_Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Job Maven_Test
        run: ./mvnw test